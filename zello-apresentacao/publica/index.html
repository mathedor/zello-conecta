<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zello Conecta · Apresentação da Plataforma</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --z:#4a7dff; --z-soft:#8eaeff; --z-deep:#1d36f5; --z-vivid:#345aff;
  --ink:#070b16; --panel:#0e1424; --panel2:#131a2e;
  --line:rgba(142,174,255,.10); --line2:rgba(142,174,255,.18);
  --tx:#f2f5fc; --mut:#94a0bd; --mut2:#5d6883;
  --red:#fb7185; --amber:#fbbf24; --grn:#34d399; --org:#fb923c;
  --sans:'Inter',system-ui,sans-serif; --disp:'Manrope','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
img{max-width:100%;display:block}

#deck{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
#deck::-webkit-scrollbar{width:0}
.slide{min-height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;padding:64px 88px 72px;overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse 90% 80% at 70% 30%,#000 20%,transparent 80%)}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.24;pointer-events:none}
.glow.a{width:540px;height:540px;background:var(--z-deep);top:-170px;right:-130px}
.glow.b{width:420px;height:420px;background:#0e7490;bottom:-180px;left:-140px;opacity:.15}

#bar{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.06);z-index:60}
#bar>i{display:block;height:100%;width:0;background:var(--z);box-shadow:0 0 18px var(--z);transition:width .3s}
#hud{position:fixed;top:18px;right:26px;z-index:60;display:flex;align-items:center;gap:14px;font-family:var(--disp);font-size:12px;color:var(--mut)}
#hud b{color:var(--tx);font-weight:700}
#hud .k{border:1px solid var(--line2);border-radius:7px;padding:4px 8px;color:var(--mut);cursor:pointer;transition:.2s}
#hud .k:hover{color:#fff;background:var(--z-vivid);border-color:var(--z-vivid)}
#rail{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:11px}
#rail a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--mut2);font-size:11px;font-family:var(--disp);font-weight:700;letter-spacing:.02em}
#rail .d{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mut2);transition:.25s;flex:none}
#rail a .t{opacity:0;transform:translateX(-6px);transition:.25s;white-space:nowrap}
#rail a:hover .t,#rail a.on .t{opacity:1;transform:none}
#rail a.on{color:var(--z-soft)}
#rail a.on .d{background:var(--z);border-color:var(--z);box-shadow:0 0 12px var(--z);transform:scale(1.15)}

.kick{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--z-soft);display:flex;align-items:center;gap:12px}
.kick::before{content:"";width:26px;height:2px;background:var(--z);display:inline-block;border-radius:2px}
h1.big{font-family:var(--disp);font-weight:800;font-size:clamp(38px,5.2vw,74px);line-height:1.02;letter-spacing:-.025em;margin:18px 0}
h2.sec{font-family:var(--disp);font-weight:800;font-size:clamp(30px,3.4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:14px 0 10px}
.lead{font-size:clamp(16px,1.5vw,20px);color:var(--mut);max-width:52ch;line-height:1.55}
.kid{font-size:17px;line-height:1.6;color:#e2e7f2;max-width:52ch}
.kid b{color:var(--z-soft);font-weight:700}
.kid .em{background:linear-gradient(transparent 62%,rgba(74,125,255,.32) 0);padding:0 2px}

#cover,#end{text-align:center;align-items:center}
.wordmark{font-family:var(--disp);font-weight:800;font-size:clamp(30px,3.6vw,46px);letter-spacing:-.03em}
.wordmark .zm{display:inline-flex;width:1.15em;height:1.15em;border-radius:.28em;background:linear-gradient(135deg,var(--z-vivid),var(--z-deep));color:#fff;align-items:center;justify-content:center;margin-right:12px;vertical-align:-12%}
.wordmark b{color:var(--z-soft);font-weight:600}
#cover .kick,#end .kick{justify-content:center;margin-top:26px}
#cover h1 .l,#end h2 .l{color:var(--z-soft)}
#cover .sub{font-size:clamp(16px,1.6vw,21px);color:var(--mut);max-width:64ch;margin:8px auto 0}
.meta{position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:space-between;padding:0 88px;font-size:12px;color:var(--mut2);font-family:var(--disp)}
kbd{border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-family:var(--disp);font-size:10px}
.cta{display:inline-block;margin-top:30px;background:linear-gradient(135deg,var(--z-vivid),var(--z-deep));color:#fff;font-family:var(--disp);font-weight:800;font-size:17px;padding:16px 34px;border-radius:999px;box-shadow:0 14px 44px -10px rgba(52,90,255,.6)}
.contact{margin-top:22px;font-size:13px;color:var(--mut)}
.contact b{color:var(--tx)}

.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:34px}
.v{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}
.v .ic{font-size:30px;margin-bottom:12px}
.v h3{font-family:var(--disp);font-weight:800;font-size:19px;margin-bottom:8px}
.v p{font-size:13.5px;color:var(--mut);line-height:1.55}
.overline{margin-top:30px;font-size:12.5px;color:var(--mut2);font-family:var(--disp)}

.levelintro{position:relative;z-index:2;max-width:1300px;margin:0 auto;width:100%}
.levelintro .no{font-family:var(--disp);font-weight:800;font-size:clamp(70px,9vw,130px);line-height:1;color:transparent;-webkit-text-stroke:2px var(--z);opacity:.9}
.levelintro .who{font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--z-soft)}
.levelintro h2{font-family:var(--disp);font-weight:800;font-size:clamp(40px,5vw,72px);letter-spacing:-.02em;line-height:1}
.levelintro .lead{margin-top:18px}
.idx{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px;max-width:900px}
.idx span{font-family:var(--disp);font-size:12px;font-weight:700;color:var(--mut);background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:20px}
.idx span b{color:var(--z-soft);margin-right:6px}

.feat{position:relative;z-index:2;display:grid;grid-template-columns:minmax(320px,42%) 1fr;gap:60px;align-items:center;width:100%;max-width:1500px;margin:0 auto}
.feat .txt .num{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--mut2)}
.feat .txt h2{font-family:var(--disp);font-weight:800;font-size:clamp(28px,3vw,44px);line-height:1.06;letter-spacing:-.02em;margin:14px 0 16px}
.feat .txt h2 .hl{color:var(--z-soft)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.pill{font-family:var(--disp);font-size:12px;font-weight:700;color:var(--tx);background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:6px 12px}
.pill.blue{background:rgba(74,125,255,.14);border-color:rgba(74,125,255,.45);color:var(--z-soft)}

.mockwrap{position:relative}
.mockwrap::after{content:"";position:absolute;inset:-30px;background:radial-gradient(60% 60% at 50% 40%,rgba(52,90,255,.12),transparent 70%);z-index:-1}
.browser{background:var(--panel);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
.browser .top{display:flex;align-items:center;gap:8px;padding:11px 14px;background:#0a0f1d;border-bottom:1px solid var(--line)}
.browser .top i{width:11px;height:11px;border-radius:50%;background:#232c44;display:inline-block}
.browser .top .url{margin-left:12px;flex:1;background:#111830;border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:11px;color:var(--mut);font-family:var(--disp)}
.browser .top .url b{color:var(--z-soft)}
.browser .body{padding:20px}
.phone{width:270px;margin:0 auto;background:var(--panel);border:8px solid #131a2e;border-radius:38px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.8);position:relative}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:90px;height:20px;background:#131a2e;border-radius:12px;z-index:5}
.phone .scr{padding:34px 14px 18px;min-height:500px}
.phone .bnav{position:absolute;bottom:0;left:0;right:0;background:#0a0f1d;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px 10px;font-size:8px;color:var(--mut2);font-family:var(--disp);font-weight:700}
.phone .bnav .bi{display:flex;flex-direction:column;align-items:center;gap:3px}
.phone .bnav .bi i{width:16px;height:16px;border-radius:5px;background:currentColor;opacity:.5}
.phone .bnav .bi.c{margin-top:-22px}
.phone .bnav .bi.c i{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--z-vivid),var(--z-deep));opacity:1;box-shadow:0 6px 18px rgba(52,90,255,.5)}
.app{display:grid;grid-template-columns:150px 1fr;min-height:340px}
.app .side{background:#0a0f1d;border-right:1px solid var(--line);padding:14px 12px}
.app .side .lg{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:800;font-size:13px;margin-bottom:16px}
.app .side .lg .m{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--z-vivid),var(--z-deep))}
.app .side .nv{font-size:11.5px;color:var(--mut);padding:7px 9px;border-radius:7px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.app .side .nv.on{background:rgba(74,125,255,.14);color:var(--z-soft);font-weight:700}
.app .side .nv .ic{width:14px;height:14px;border-radius:4px;background:currentColor;opacity:.5}
.app .main{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.kpi .l{font-size:10.5px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;font-family:var(--disp)}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:23px;margin-top:5px;letter-spacing:-.02em}
.kpi .dl{font-size:11px;margin-top:3px;color:var(--grn);font-weight:600}
.kpi.hi{background:linear-gradient(160deg,rgba(74,125,255,.18),rgba(74,125,255,.03));border-color:rgba(74,125,255,.4)}
.kpi.hi .v{color:var(--z-soft)}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .h{font-family:var(--disp);font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .h .tag{font-size:10px;color:var(--z-soft);background:rgba(74,125,255,.13);border-radius:5px;padding:2px 7px;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:9px;height:110px}
.bars .b{flex:1;background:linear-gradient(180deg,var(--z),rgba(74,125,255,.22));border-radius:5px 5px 0 0;min-height:6px}
.line-lbls{display:flex;gap:9px;margin-top:8px}
.line-lbls span{flex:1;text-align:center;font-size:9px;color:var(--mut2);font-family:var(--disp)}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rows .r{display:grid;grid-template-columns:1.6fr 1fr 1fr .8fr;gap:8px;padding:10px 13px;background:var(--panel2);font-size:11.5px;align-items:center}
.rows .r.hd{background:#0a0f1d;color:var(--mut);font-family:var(--disp);font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.rows .r b{font-weight:600}
.st{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;justify-self:start}
.st.ok{background:rgba(52,211,153,.15);color:var(--grn)}
.st.wa{background:rgba(251,191,36,.15);color:var(--amber)}
.st.no{background:rgba(251,113,133,.15);color:var(--red)}
.st.bl{background:rgba(74,125,255,.16);color:var(--z-soft)}
.list{display:flex;flex-direction:column;gap:7px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:11.5px}
.li .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,var(--z-vivid),var(--z-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;font-family:var(--disp);flex:none}
.li .g{flex:1;min-width:0}
.li .g b{display:block;font-weight:600}
.li .g small{color:var(--mut);font-size:10px}
.stars{color:var(--amber);letter-spacing:1px;font-size:12px}
.qrbox{width:120px;height:120px;margin:0 auto;border-radius:14px;background:#fff;padding:10px}
.qrbox img{width:100%;height:100%;image-rendering:pixelated}
.progressbar{height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
.progressbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--z),var(--z-deep))}
.calgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calgrid .slot{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 4px;text-align:center;font-size:10.5px;font-family:var(--disp);font-weight:700}
.calgrid .slot.on{background:rgba(74,125,255,.2);border-color:var(--z);color:var(--z-soft)}
.calgrid .slot.off{opacity:.3;text-decoration:line-through}
.chatmsg{background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:9px 11px;font-size:11px;max-width:85%;margin-bottom:6px}
.chatmsg.me{background:rgba(74,125,255,.16);border-color:rgba(74,125,255,.35);border-radius:12px 12px 3px 12px;margin-left:auto}
.big-blue{background:linear-gradient(120deg,var(--z-deep),var(--z-vivid));border-radius:16px;padding:16px;margin-bottom:10px}
.big-blue small{color:rgba(255,255,255,.75);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-family:var(--disp)}
.big-blue b{display:block;font-family:var(--disp);font-size:27px;font-weight:800;margin-top:3px}
.mail{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;overflow:hidden;max-width:420px}
.mail .mh{background:#0a0f1d;padding:11px 14px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--line)}
.mail .mh b{color:var(--tx)}
.mail .mb{padding:16px 14px;font-size:12px;color:#dde3f0;line-height:1.55}
.escrowflow{display:flex;flex-direction:column;gap:8px}
.escrowflow .ef{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:11.5px}
.escrowflow .ef .n{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--z-vivid),var(--z-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:12px;flex:none}
.escrowflow .ef.hi{border-color:rgba(52,211,153,.4);background:linear-gradient(160deg,rgba(52,211,153,.1),transparent)}

.revgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}
.rev{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.rev .ic{font-size:22px}
.rev h4{font-family:var(--disp);font-weight:800;font-size:14.5px;margin:8px 0 4px}
.rev p{font-size:11.5px;color:var(--mut);line-height:1.5}
.rev b{color:var(--z-soft)}

@media (max-width:980px){
  .slide{padding:56px 26px 64px}
  #rail{display:none}
  .feat{grid-template-columns:1fr;gap:30px}
  .feat .mockwrap{order:-1}
  .vg{grid-template-columns:1fr}
  .revgrid{grid-template-columns:1fr 1fr}
  .meta{padding:0 26px}
  .phone{width:240px}.phone .scr{min-height:440px}
  .app{grid-template-columns:1fr}.app .side{display:none}
}
@media (max-width:560px){.revgrid{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="bar"><i></i></div>
<div id="hud"><span><b id="cur">01</b> / <span id="tot">00</span></span><span class="k" onclick="document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()">⛶ F</span></div>
<nav id="rail"></nav>
<main id="deck"></main>

<script>
const SHOW_ADMIN = false;

const QR = "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' shape-rendering='crispEdges'><rect width='100' height='100' fill='%23fff'/>`+
  Array.from({length:11},(_,y)=>Array.from({length:11},(_,x)=>((x*7+y*13+x*y)%3===0||(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7))?`<rect x='${9*x}' y='${9*y}' width='9' height='9' fill='%23000'/>`:'').join('')).join('')+`</svg>`);

const LEVELS = [
  {id:'intro', label:'Início'},
  {id:'cli',   label:'Cliente'},
  {id:'pro',   label:'Profissional'},
  ...(SHOW_ADMIN?[{id:'admin', label:'Administração'}]:[]),
  {id:'fim',   label:'Fim'},
];

const appShell = (items, active, main) => `
<div class="browser"><div class="top"><i></i><i></i><i></i><div class="url">zelloconecta.com.br/<b>${active.toLowerCase().replace(/\\s/g,'-')}</b></div></div>
<div class="app">
  <div class="side">
    <div class="lg"><span class="m"></span> Zello</div>
    ${items.map(n=>`<div class="nv ${n===active?'on':''}"><span class="ic"></span>${n}</div>`).join('')}
  </div>
  <div class="main">${main}</div>
</div></div>`;

const PRO_NAV = ['Painel','Serviços','Agenda','Pedidos','Mensagens','Financeiro'];
const ADMIN_NAV = ['Dashboard','Usuários','Profissionais','KYC','Saques','Disputas','Categorias'];

const phone = (scr, nav=true) => `<div class="phone"><div class="notch"></div><div class="scr" style="${nav?'padding-bottom:70px':''}">${scr}</div>${nav?`
  <div class="bnav">
    <span class="bi"><i></i>Agenda</span>
    <span class="bi"><i></i>Categorias</span>
    <span class="bi c"><i></i></span>
    <span class="bi"><i></i>Conta</span>
    <span class="bi"><i></i>Menu</span>
  </div>`:''}</div>`;

const SLIDES = [];
const S = (o)=>SLIDES.push(o);

/* ========================= CAPA ========================= */
S({type:'cover'});
S({type:'value'});
S({type:'levelmap'});

/* ========================= 01 CLIENTE ========================= */
S({type:'intro', level:'cli', no:'01', who:'A experiência de quem contrata', title:'Cliente',
  desc:'Precisa de advogado, encanador, designer, personal? O cliente busca, compara profissionais de verdade (com avaliação e agenda real), agenda o horário e paga com o dinheiro protegido até o serviço ser entregue.',
  idx:['Busca com filtros','Perfil do profissional','Agendamento com hora marcada','Checkout PIX & cartão','Pagamento protegido (escrow)','Acompanhar & concluir','Avaliações','Chat com o profissional','Mobile-first']});

S({level:'cli', n:'Busca com filtros', title:['Ache o profissional certo ','sem cadastro'],
  kid:'A navegação é <b>totalmente aberta</b>: qualquer pessoa busca, filtra e compara sem criar conta — o login só aparece na hora de fechar. Filtro por <span class="em">categoria, cidade, preço e nota</span>, com ordenação.',
  pills:['Sem login pra navegar','Filtro por cidade e categoria','Faixa de preço e nota mínima','Só aparece profissional verificado'],
  mock:`<div class="browser"><div class="top"><i></i><i></i><i></i><div class="url">zelloconecta.com.br/<b>buscar?q=eletricista</b></div></div>
    <div class="body">
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
        <span class="st bl">📍 São Paulo · SP</span><span class="st bl">⚡ Reformas</span><span class="st bl">⭐ 4+</span><span class="st bl">até R$ 150/h</span>

const railEl=document.getElementById('rail');
const firstOf={};
secOrder.forEach((lvl,i)=>{if(firstOf[lvl]===undefined)firstOf[lvl]=i});
LEVELS.forEach(l=>{
  if(firstOf[l.id]===undefined)return;
  const a=document.createElement('a');
  a.href='#';a.dataset.lvl=l.id;
  a.innerHTML=`<span class="d"></span><span class="t">${l.label}</span>`;
  a.onclick=(e)=>{e.preventDefault();goTo(firstOf[l.id])};
  railEl.appendChild(a);
});

const slides=[...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent=String(slides.length).padStart(2,'0');
let idx=0;
function goTo(i){idx=Math.max(0,Math.min(slides.length-1,i));slides[idx].scrollIntoView()}
function next(){goTo(idx+1)} function prev(){goTo(idx-1)}

const io=new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){
    idx=+e.target.dataset.i;
    document.getElementById('cur').textContent=String(idx+1).padStart(2,'0');
    document.getElementById('bar').firstElementChild.style.width=((idx)/(slides.length-1)*100)+'%';
    const lvl=e.target.dataset.level;
    [...railEl.children].forEach(a=>a.classList.toggle('on',a.dataset.lvl===lvl));
  }});
},{threshold:.55});
slides.forEach(s=>io.observe(s));

addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();next()}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();prev()}
  if(e.key==='Home')goTo(0);if(e.key==='End')goTo(slides.length-1);
  if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}
});
</script>
